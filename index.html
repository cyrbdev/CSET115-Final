<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">TIC-TAC-TOE</header>

    <div class="playerLabels">
    <div id="player1" class="player1">Player 1 is X</div>
    <div id="player2" class="player2">Player 2 is O</div>
    </div>

    <div class="game">

    <div class="score">
    <h1>PLAYER 1:</h1>
    <div id="player1Score"></div>
    </div>

        <div class="playingField">
            <button id="box1" class="box"></button>
            <button id="box2" class="box"></button>
            <button id="box3" class="box"></button>
            <button id="box4" class="box"></button>
            <button id="box5" class="box"></button>
            <button id="box6" class="box"></button>
            <button id="box7" class="box"></button>
            <button id="box8" class="box"></button>
            <button id="box9" class="box"></button>
        </div>

        <div class="score">
            <h1>PLAYER 2:</h1>
            <div id="player2Score"></div>
        </div>
    </div>
    
    <div class="draw">
            <h1>DRAWS:</h1>
            <div id="score"></div>
        </div>

    <script src="script.js"></script>
</body>
</html>
